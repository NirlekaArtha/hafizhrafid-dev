name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # Sesuaikan dengan ./docker/php/Dockerfile (atau '8.5' jika memakai 8.5)
          extensions: mbstring, dom, fileinfo, pgsql, pdo_pgsql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instal dependensi Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit kerentanan dependensi Composer
        run: composer audit --no-interaction

      - name: Instal & build aset frontend (Vite)
        run: |
          npm ci
          npm run build

      - name: Siapkan environment Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan Pint (Lint)
        run: ./vendor/bin/pint --test

      - name: Jalankan Larastan (Analisis Statis)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Jalankan Pest (Test)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: ./vendor/bin/pest
